[AccessTransformers]
; Feature 1 (stack height): current zoop amount and build step are private/protected;
; the server's build-confirmation RPC is protected.
Accessor=(Class="AFGBuildableHologram", Property="mDesiredZoop")
Accessor=(Class="AFGBuildableHologram", Property="mBuildableHologramBuildStep")
Friend=(Class="UFGBuildGunStateBuild", FriendClass="FToolbeltStackHooks")

; Feature 3 (zoop by default): each hologram's zoop build-mode descriptor is protected.
Accessor=(Class="AFGBuildableHologram", Property="mBuildModeZoop")

; Feature 4 (ghost preview): spline routing, spline update and validation are private/protected.
Friend=(Class="AFGConveyorBeltHologram", FriendClass="FToolbeltGhost")
Friend=(Class="AFGPipelineHologram", FriendClass="FToolbeltGhost")
Friend=(Class="AFGSplineHologram", FriendClass="FToolbeltGhost")

; Feature 5 (power pole tier from buildings): the wire hologram's auto-pole recipes are private.
Accessor=(Class="AFGWireHologram", Property="mDefaultPowerPoleRecipe")
Accessor=(Class="AFGWireHologram", Property="mDefaultPowerPoleWallRecipe")
